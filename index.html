<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="素龙记账">
    <meta name="theme-color" content="#d4a5a5">
    <title>素龙记账</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --morandi-pink:#d4a5a5;--morandi-pink-deep:#b88a8a;--morandi-pink-light:#e8d0d0;
            --morandi-green:#9bb8a6;--morandi-green-deep:#7d9e89;
            --morandi-coral:#d4887a;--morandi-coral-deep:#b86f62;
            --morandi-blue:#b8c5d6;--morandi-yellow:#e8d5a3;--morandi-purple:#c5b8d6;
            --bg:#f7f2ef;--card-bg:#ffffff;--text-primary:#5a5551;--text-secondary:#8a8581;
            --text-hint:#b5b0ab;--border:#ede8e5;
            --shadow:0 4px 20px rgba(90,85,81,0.06);--radius:20px;
            --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + var(--safe-bottom));overflow-x:hidden}
        .header{background:linear-gradient(135deg,var(--morandi-pink) 0%,var(--morandi-pink-deep) 100%);color:white;padding:calc(18px + var(--safe-top)) 20px 80px;position:relative;overflow:hidden}
        .header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:rgba(255,255,255,0.1);border-radius:50%}
        .header::after{content:'';position:absolute;bottom:-30px;left:-30px;width:120px;height:120px;background:rgba(255,255,255,0.08);border-radius:50%}
        .header h1{font-size:22px;font-weight:700;margin-bottom:6px;position:relative;z-index:2}
        .lucky-quote{font-size:13px;opacity:0.92;position:relative;z-index:2;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:90%}
        .lucky-quote .star{font-size:14px}
        .dino-wrap{position:absolute;right:16px;bottom:12px;width:72px;height:72px;z-index:2;opacity:0.95}
        .month-selector{display:flex;align-items:center;justify-content:space-between;margin-top:18px;background:rgba(255,255,255,0.18);border-radius:14px;padding:10px 16px;position:relative;z-index:2;backdrop-filter:blur(4px)}
        .month-selector button{background:rgba(255,255,255,0.22);border:none;color:white;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .month-selector button:active{background:rgba(255,255,255,0.35);transform:scale(0.92)}
        .month-display{font-size:17px;font-weight:600}
        .overview{margin:-50px 18px 0;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;position:relative;z-index:10}
        .overview-row{display:flex;justify-content:space-between;gap:10px}
        .overview-item{flex:1;text-align:center;position:relative}
        .overview-item:not(:last-child)::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);height:70%;width:1px;background:var(--border)}
        .overview-item .label{font-size:12px;color:var(--text-hint);margin-bottom:8px;font-weight:500}
        .overview-item .value{font-size:22px;font-weight:700}
        .overview-item.income .value{color:var(--morandi-green-deep)}
        .overview-item.expense .value{color:var(--morandi-coral-deep)}
        .overview-item.balance .value{color:var(--morandi-pink-deep)}
        .dino-divider{height:40px;margin:0 18px;display:flex;align-items:center;justify-content:center;opacity:0.7;gap:16px}
        .section{margin:18px 18px 0}
        .section-title{font-size:15px;font-weight:700;color:var(--text-secondary);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
        .section-title::before{content:'';display:inline-block;width:4px;height:16px;background:var(--morandi-pink);border-radius:2px;margin-right:8px}
        .chart-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
        .pie-chart-wrap{position:relative;width:170px;height:170px;margin:0 auto 14px}
        .pie-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
        .pie-center .label{font-size:11px;color:var(--text-hint)}
        .pie-center .value{font-size:18px;font-weight:700;color:var(--morandi-coral-deep)}
        .legend-list{width:100%}
        .legend-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
        .legend-item:last-child{border-bottom:none}
        .legend-left{display:flex;align-items:center;gap:8px}
        .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .legend-name{font-size:14px;color:var(--text-primary)}
        .legend-right{text-align:right}
        .legend-amount{font-size:14px;font-weight:700;color:var(--text-primary)}
        .legend-percent{font-size:11px;color:var(--text-hint)}
        .empty-chart{text-align:center;padding:36px 0;color:var(--text-hint);font-size:14px}
        .chart-tabs{display:flex;gap:0;margin-bottom:16px;background:var(--bg);border-radius:12px;padding:4px}
        .chart-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-hint);cursor:pointer;transition:all 0.2s}
        .chart-tab.active{background:var(--card-bg);color:var(--morandi-pink-deep);box-shadow:0 2px 8px rgba(90,85,81,0.08)}
        .record-list{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
        .record-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
        .record-item:active{background:#faf8f6}
        .record-item:last-child{border-bottom:none}
        .record-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-right:12px;flex-shrink:0;background:var(--morandi-pink-light)}
        .record-icon svg{width:24px;height:24px}
        .record-info{flex:1;min-width:0}
        .record-category{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .record-tag-badge{font-size:10px;padding:2px 10px;border-radius:12px;font-weight:500}
        .record-meta{font-size:12px;color:var(--text-hint);display:flex;gap:8px;align-items:center}
        .record-note{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .record-amount{font-size:17px;font-weight:700;flex-shrink:0}
        .record-amount.expense{color:var(--morandi-coral-deep)}
        .record-amount.income{color:var(--morandi-green-deep)}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);box-shadow:0 -2px 16px rgba(90,85,81,0.06);display:flex;padding:10px 0 calc(10px + var(--safe-bottom));z-index:200}
        .nav-item{flex:1;text-align:center;padding:6px 0;color:var(--text-hint);font-size:11px;cursor:pointer;transition:color 0.2s}
        .nav-item.active{color:var(--morandi-pink-deep)}
        .nav-item .nav-icon{width:24px;height:24px;margin:0 auto 3px;display:block;fill:currentColor}
        .fab{position:fixed;bottom:calc(96px + var(--safe-bottom));right:22px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--morandi-pink),var(--morandi-pink-deep));color:white;border:none;font-size:28px;box-shadow:0 6px 20px rgba(180,138,138,0.35);cursor:pointer;z-index:150;display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
        .fab:active{transform:scale(0.92)}
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(90,85,81,0.45);z-index:300;align-items:flex-end;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal{background:var(--card-bg);border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:24px 22px calc(24px + var(--safe-bottom));animation:slideUp 0.32s ease;max-height:92vh;overflow-y:auto}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
        .modal-title{font-size:19px;font-weight:700;color:var(--text-primary)}
        .modal-close{background:none;border:none;font-size:26px;color:var(--text-hint);cursor:pointer;padding:4px 8px}
        .form-group{margin-bottom:18px}
        .form-label{font-size:13px;color:var(--text-secondary);margin-bottom:9px;display:block;font-weight:600}
        .type-toggle{display:flex;gap:0;border-radius:14px;overflow:hidden;border:2px solid var(--border)}
        .type-toggle button{flex:1;padding:13px;border:none;background:white;font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all 0.2s}
        .type-toggle button.active.expense{background:var(--morandi-coral);color:white}
        .type-toggle button.active.income{background:var(--morandi-green);color:white}
        .form-input,.form-select,.form-textarea{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--text-primary);background:white;transition:border-color 0.2s}
        .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--morandi-pink)}
        .form-textarea{resize:none;height:64px}
        .category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
        .category-btn{padding:10px 4px;border:2px solid var(--border);border-radius:16px;background:white;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all 0.2s;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
        .category-btn svg{width:28px;height:28px}
        .category-btn.active{border-color:var(--morandi-pink);background:#fdf8f8;color:var(--morandi-pink-deep)}
        .category-btn .cat-delete{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--morandi-coral);color:white;font-size:11px;display:none;align-items:center;justify-content:center;border:none;cursor:pointer;line-height:1}
        .category-btn.custom .cat-delete{display:flex}
        .tag-grid{display:flex;flex-wrap:wrap;gap:10px}
        .tag-btn{padding:9px 18px;border:2px solid var(--border);border-radius:24px;background:white;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all 0.2s;position:relative;font-weight:500}
        .tag-btn.active{border-color:var(--morandi-pink);background:#fdf8f8;color:var(--morandi-pink-deep)}
        .tag-btn .tag-delete{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--morandi-coral);color:white;font-size:11px;display:none;align-items:center;justify-content:center;border:none;cursor:pointer;line-height:1}
        .tag-btn.custom .tag-delete{display:flex}
        .add-cat-btn{padding:10px 4px;border:2px dashed var(--morandi-pink-light);border-radius:16px;background:transparent;font-size:12px;color:var(--text-hint);cursor:pointer;transition:all 0.2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
        .add-cat-btn svg{width:28px;height:28px;fill:var(--morandi-pink)}
        .add-cat-btn:active{border-color:var(--morandi-pink);color:var(--morandi-pink)}
        .add-tag-btn{padding:9px 18px;border:2px dashed var(--morandi-pink-light);border-radius:24px;background:transparent;font-size:13px;color:var(--text-hint);cursor:pointer;transition:all 0.2s;font-weight:500}
        .add-tag-btn:active{border-color:var(--morandi-pink);color:var(--morandi-pink)}
        .form-actions{display:flex;gap:12px;margin-top:26px}
        .btn{flex:1;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity 0.2s}
        .btn:active{opacity:0.8}
        .btn-primary{background:var(--morandi-pink);color:white}
        .btn-danger{background:#fbeae8;color:var(--morandi-coral-deep);border:2px solid #f5d8d4}
        .btn-secondary{background:var(--border);color:var(--text-secondary)}
        .plan-summary{display:flex;gap:12px;margin:0 18px}
        .plan-summary-card{flex:1;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 10px;text-align:center}
        .plan-summary-card .num{font-size:26px;font-weight:700;margin-bottom:5px}
        .plan-summary-card .lbl{font-size:11px;color:var(--text-hint);font-weight:500}
        .plan-summary-card.total .num{color:var(--morandi-pink-deep)}
        .plan-summary-card.ongoing .num{color:var(--morandi-blue)}
        .plan-summary-card.done .num{color:var(--morandi-green-deep)}
        .plan-total-card{margin:16px 18px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;justify-content:space-between;align-items:center}
        .plan-dino{width:60px;height:60px;flex-shrink:0}
        .plan-list{margin:18px 18px 0}
        .plan-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;cursor:pointer;transition:transform 0.15s}
        .plan-card:active{transform:scale(0.98)}
        .plan-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
        .plan-card-title{font-size:16px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:6px}
        .plan-card-status{font-size:11px;padding:3px 12px;border-radius:20px;font-weight:600}
        .plan-card-status.ongoing{background:#eef3f8;color:#6b8cae}
        .plan-card-status.done{background:#eaf4ee;color:var(--morandi-green-deep)}
        .plan-card-amounts{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);margin-bottom:10px}
        .plan-card-amounts .current{font-weight:700;color:var(--morandi-pink-deep)}
        .plan-card-amounts .target{color:var(--text-hint)}
        .progress-bar{height:9px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:8px}
        .progress-fill{height:100%;border-radius:5px;transition:width 0.4s ease}
        .progress-fill.ongoing{background:linear-gradient(90deg,var(--morandi-blue),#9fb6ce)}
        .progress-fill.done{background:linear-gradient(90deg,var(--morandi-green),var(--morandi-green-deep))}
        .plan-card-footer{display:flex;justify-content:space-between;font-size:12px;color:var(--text-hint)}
        .plan-card-quick{display:flex;gap:8px;margin-top:12px}
        .plan-card-quick button{flex:1;padding:9px;border:none;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
        .plan-card-quick button:active{opacity:0.7}
        .quick-deposit{background:#eef3f8;color:#6b8cae}
        .quick-done{background:#eaf4ee;color:var(--morandi-green-deep)}
        .settings-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
        .settings-item{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
        .settings-item:active{background:#faf8f6}
        .settings-item:last-child{border-bottom:none}
        .settings-item-left{display:flex;align-items:center;gap:12px}
        .settings-item-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg)}
        .settings-item-label{font-size:15px;font-weight:600;color:var(--text-primary)}
        .settings-item-value{font-size:13px;color:var(--text-hint)}
        .settings-item-arrow{color:var(--text-hint);font-size:18px}
        .page{display:none}
        .page.active{display:block}
        .empty-list{text-align:center;padding:60px 20px;color:var(--text-hint)}
        .empty-list .dino-empty{width:120px;height:120px;margin:0 auto 16px;opacity:0.8}
        .toast{position:fixed;top:calc(80px + var(--safe-top));left:50%;transform:translateX(-50%);background:rgba(90,85,81,0.85);color:white;padding:11px 26px;border-radius:24px;font-size:14px;z-index:400;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px)}
        .toast.show{opacity:1}
        .confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(90,85,81,0.45);z-index:500;align-items:center;justify-content:center}
        .confirm-overlay.show{display:flex}
        .confirm-dialog{background:white;border-radius:20px;padding:26px;width:82%;max-width:320px;text-align:center;box-shadow:var(--shadow)}
        .confirm-dialog .title{font-size:18px;font-weight:700;margin-bottom:10px;color:var(--text-primary)}
        .confirm-dialog .msg{font-size:14px;color:var(--text-secondary);margin-bottom:22px}
        .confirm-dialog .btns{display:flex;gap:12px}
        .confirm-dialog .btns .btn{padding:11px}
        .input-dialog-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(90,85,81,0.45);z-index:500;align-items:center;justify-content:center}
        .input-dialog-overlay.show{display:flex}
        .input-dialog{background:white;border-radius:20px;padding:24px;width:86%;max-width:340px;box-shadow:var(--shadow)}
        .input-dialog .title{font-size:17px;font-weight:700;margin-bottom:18px;text-align:center;color:var(--text-primary)}
        .input-dialog input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:14px;font-size:15px;margin-bottom:10px;color:var(--text-primary)}
        .input-dialog input:focus{outline:none;border-color:var(--morandi-pink)}
        .icon-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;max-height:120px;overflow-y:auto;justify-content:center}
        .icon-pick{width:40px;height:40px;border-radius:12px;border:2px solid var(--border);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .icon-pick svg{width:24px;height:24px}
        .icon-pick.active{border-color:var(--morandi-pink);background:#fdf8f8}
    </style>
</head>
<body>

<div id="page-home" class="page active">
    <div class="header">
        <h1>🦖 素龙记账</h1>
        <div class="lucky-quote" id="luckyQuote"><span class="star">✨</span><span id="quoteText">今日好运加载中...</span></div>
        <div class="dino-wrap" id="headerDino"></div>
        <div class="month-selector">
            <button onclick="changeMonth(-1)">‹</button>
            <span class="month-display" id="monthDisplay">2026年7月</span>
            <button onclick="changeMonth(1)">›</button>
        </div>
    </div>
    <div class="overview">
        <div class="overview-row">
            <div class="overview-item income"><div class="label">收入</div><div class="value" id="totalIncome">¥0.00</div></div>
            <div class="overview-item expense"><div class="label">支出</div><div class="value" id="totalExpense">¥0.00</div></div>
            <div class="overview-item balance"><div class="label">结余</div><div class="value" id="totalBalance">¥0.00</div></div>
        </div>
    </div>
    <div class="dino-divider" id="dinoDivider"></div>
    <div class="section">
        <div class="section-title"><span>支出分析</span></div>
        <div class="chart-card">
            <div class="chart-tabs">
                <button class="chart-tab active" onclick="switchChartTab('category', this)">按分类</button>
                <button class="chart-tab" onclick="switchChartTab('tag', this)">按标签</button>
            </div>
            <div id="chartArea"></div>
        </div>
    </div>
    <div class="section">
        <div class="section-title"><span>收支明细</span><span id="recordCount" style="font-size:12px;color:var(--text-hint);font-weight:500"></span></div>
        <div class="record-list" id="recordList"></div>
    </div>
</div>

<div id="page-plans" class="page">
    <div class="header">
        <h1>🎯 存钱计划</h1>
        <div class="lucky-quote"><span class="star">🌟</span>慢慢存钱，慢慢变富</div>
        <div class="dino-wrap" id="planHeaderDino"></div>
    </div>
    <div style="padding:20px 18px 0;margin-top:-54px;position:relative;z-index:10">
        <div class="plan-summary">
            <div class="plan-summary-card total"><div class="num" id="planTotal">0</div><div class="lbl">全部计划</div></div>
            <div class="plan-summary-card ongoing"><div class="num" id="planOngoing">0</div><div class="lbl">进行中</div></div>
            <div class="plan-summary-card done"><div class="num" id="planDone">0</div><div class="lbl">已完成</div></div>
        </div>
        <div class="plan-total-card">
            <div>
                <div style="font-size:13px;color:var(--text-hint);margin-bottom:5px">累计已存 / 目标总额</div>
                <div style="font-size:20px;font-weight:700;color:var(--morandi-pink-deep)"><span id="planTotalSaved">¥0.00</span> <span style="font-size:14px;color:var(--text-hint);font-weight:500">/ <span id="planTotalTarget">¥0.00</span></span></div>
            </div>
            <div class="plan-dino" id="planDino"></div>
        </div>
    </div>
    <div class="plan-list" id="planList"></div>
</div>

<div id="page-settings" class="page">
    <div class="header">
        <h1>⚙️ 设置</h1>
        <div class="lucky-quote"><span class="star">💫</span>数据无价，记得备份</div>

function loadData() {

function getCategories(type) {
    const defaults = DEFAULT_CATEGORIES[type] || [];
    const customs = DATA.customCategories.filter(c => c.type === type);
    return [...defaults, ...customs];
}
function getTags() { return [...DEFAULT_TAGS, ...DATA.customTags]; }
function getCategoryIcon(name, type) {
    const cats = getCategories(type);
    const found = cats.find(c => c.name === name);
    return found ? found.icon : 'other';
}

const MORANDI_COLORS = ['#d4a5a5', '#9bb8a6', '#d4887a', '#b8c5d6', '#e8d5a3', '#c5b8d6', '#b88a8a', '#7d9e89', '#a3b8d4', '#d4b8a5'];

// ============ 好运语录渲染（每日轮换）============
function renderLuckyQuote() {
    const today = new Date();
    const todayStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
    const savedDate = localStorage.getItem(QUOTE_KEY);
    let quoteIdx;
    if (savedDate === todayStr) {
        quoteIdx = parseInt(localStorage.getItem('sulong_quote_idx') || '0');
    } else {
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
        quoteIdx = dayOfYear % LUCKY_QUOTES.length;
        localStorage.setItem(QUOTE_KEY, todayStr);
        localStorage.setItem('sulong_quote_idx', String(quoteIdx));
    }
    document.getElementById('quoteText').textContent = LUCKY_QUOTES[quoteIdx];
}

// ============ 工具函数 ============
function formatMoney(n) { return '¥' + parseFloat(n || 0).toFixed(2); }
function formatDate(d) {
    const dt = new Date(d);
    return (dt.getMonth()+1) + '月' + dt.getDate() + '日';
}
function getMonthStr(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function getMonthDisplay(d) { return d.getFullYear() + '年' + (d.getMonth()+1) + '月'; }
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

}

let inputDialogCallback = null;
let inputDialogSelectedIcon = null;
function showInputDialog(title, placeholder, showIconPicker, cb) {
    document.getElementById('inputDialogTitle').textContent = title;
    document.getElementById('customInput').placeholder = placeholder;
    document.getElementById('customInput').value = '';
    inputDialogSelectedIcon = null;
    const picker = document.getElementById('iconPicker');
    if (showIconPicker) {
        picker.style.display = 'flex';
        picker.innerHTML = CUSTOM_ICON_OPTIONS.map((icon, i) =>
            '<div class="icon-pick ' + (i===0?'active':'') + '" data-icon="' + icon + '" onclick="selectDialogIcon(this,\'' + icon + '\')">' + (SVG_ICONS[icon] || '') + '</div>'
        ).join('');
        inputDialogSelectedIcon = CUSTOM_ICON_OPTIONS[0];
    } else { picker.style.display = 'none'; }
    inputDialogCallback = cb;
    document.getElementById('inputDialogOverlay').classList.add('show');
    setTimeout(function() { document.getElementById('customInput').focus(); }, 100);
}
function selectDialogIcon(el, icon) {
    document.querySelectorAll('.icon-pick').forEach(function(e) { e.classList.remove('active'); });
    el.classList.add('active');
    inputDialogSelectedIcon = icon;
}
function hideInputDialog() { document.getElementById('inputDialogOverlay').classList.remove('show'); inputDialogCallback = null; }
document.getElementById('inputDialogOkBtn').onclick = function() {
    const val = document.getElementById('customInput').value.trim();
    if (!val) { toast('请输入名称'); return; }
    if (inputDialogCallback) inputDialogCallback(val, inputDialogSelectedIcon);
    hideInputDialog();
};

function switchPage(page, navEl) {

    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });

// ============ 首页渲染 ============
function renderHome() {
    renderMonthDisplay();
    const monthStr = getMonthStr(STATE.currentMonth);
    const monthRecords = DATA.records.filter(function(r) { return r.date.startsWith(monthStr); });
    var income = 0, expense = 0;
    monthRecords.forEach(function(r) {
        if (r.type === 'income') income += parseFloat(r.amount);
        else expense += parseFloat(r.amount);
    });
    document.getElementById('totalIncome').textContent = formatMoney(income);
    document.getElementById('totalExpense').textContent = formatMoney(expense);
    document.getElementById('totalBalance').textContent = formatMoney(income - expense);
    renderChart(monthRecords);
    renderRecordList(monthRecords);
}

// ============ 饼图渲染 ============
function switchChartTab(tab, el) {
    STATE.chartTab = tab;
    document.querySelectorAll('.chart-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    const monthStr = getMonthStr(STATE.currentMonth);
    const monthRecords = DATA.records.filter(function(r) { return r.date.startsWith(monthStr); });
    renderChart(monthRecords);
}

function renderChart(records) {
    var expenseRecords = records.filter(function(r) { return r.type === 'expense'; });
    var chartData = [];
    if (STATE.chartTab === 'category') {
        var catMap = {};
        expenseRecords.forEach(function(r) {
            var key = r.category;
            if (!catMap[key]) catMap[key] = 0;
            catMap[key] += parseFloat(r.amount);
        });
        Object.keys(catMap).forEach(function(k) { chartData.push({ name: k, value: catMap[k] }); });
    } else {
        var tagMap = {};
        expenseRecords.forEach(function(r) {
            var key = r.tag || '未分类';
            if (!tagMap[key]) tagMap[key] = 0;
            tagMap[key] += parseFloat(r.amount);
        });
        Object.keys(tagMap).forEach(function(k) { chartData.push({ name: k, value: tagMap[k] }); });
    }
    chartData.sort(function(a, b) { return b.value - a.value; });
    var total = chartData.reduce(function(s, d) { return s + d.value; }, 0);
    var area = document.getElementById('chartArea');
    if (total === 0) {
        area.innerHTML = '<div class="empty-chart">本月暂无支出数据<br>开始记录第一笔吧~</div>';
        return;
    }
    var svg = renderDonutChart(chartData, total);
    var legend = chartData.map(function(d, i) {
        var color = MORANDI_COLORS[i % MORANDI_COLORS.length];
        var pct = (d.value / total * 100).toFixed(1);
        return '<div class="legend-item">' +
            '<div class="legend-left"><div class="legend-dot" style="background:' + color + '"></div><div class="legend-name">' + d.name + '</div></div>' +
            '<div class="legend-right"><div class="legend-amount">' + formatMoney(d.value) + '</div><div class="legend-percent">' + pct + '%</div></div>' +
            '</div>';
    }).join('');
    area.innerHTML = '<div class="pie-chart-wrap">' + svg + '<div class="pie-center"><div class="label">总支出</div><div class="value">' + formatMoney(total) + '</div></div></div><div class="legend-list">' + legend + '</div>';
}

function renderDonutChart(data, total) {
    var cx = 85, cy = 85, r = 70, rInner = 48;
    var angle = -Math.PI / 2;
    var paths = '';
    data.forEach(function(d, i) {
        var color = MORANDI_COLORS[i % MORANDI_COLORS.length];
        var sweep = (d.value / total) * Math.PI * 2;
        var x1 = cx + r * Math.cos(angle);
        var y1 = cy + r * Math.sin(angle);
        var x2 = cx + r * Math.cos(angle + sweep);
        var y2 = cy + r * Math.sin(angle + sweep);
        var x3 = cx + rInner * Math.cos(angle + sweep);
        var y3 = cy + rInner * Math.sin(angle + sweep);
        var x4 = cx + rInner * Math.cos(angle);
        var y4 = cy + rInner * Math.sin(angle);
        var large = sweep > Math.PI ? 1 : 0;
        paths += '<path d="M' + x1 + ' ' + y1 + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' L' + x3 + ' ' + y3 + ' A' + rInner + ' ' + rInner + ' 0 ' + large + ' 0 ' + x4 + ' ' + y4 + ' Z" fill="' + color + '" stroke="white" stroke-width="2"/>';
        angle += sweep;
    });
    return '<svg viewBox="0 0 170 170" style="width:100%;height:100%">' + paths + '</svg>';
}

            r.tag = STATE.selectedType === 'expense' ? STATE.selectedTag : null;

        DATA.records.push({

            category: STATE.selectedCategory,

function renderPlans() {
    var total = DATA.plans.length;
    var ongoing = DATA.plans.filter(function(p) { return p.status === 'ongoing'; }).length;
    var done = DATA.plans.filter(function(p) { return p.status === 'done'; }).length;
    var totalSaved = DATA.plans.reduce(function(s, p) { return s + parseFloat(p.current || 0); }, 0);
    var totalTarget = DATA.plans.reduce(function(s, p) { return s + parseFloat(p.target || 0); }, 0);
    document.getElementById('planTotal').textContent = total;
    document.getElementById('planOngoing').textContent = ongoing;
    document.getElementById('planDone').textContent = done;
    document.getElementById('planTotalSaved').textContent = formatMoney(totalSaved);
    document.getElementById('planTotalTarget').textContent = formatMoney(totalTarget);
    var list = document.getElementById('planList');
    if (total === 0) {
        list.innerHTML = '<div class="empty-list"><div class="dino-empty">' + SVG_ICONS.dinoEmpty + '</div><div>还没有存钱计划</div><div style="font-size:12px;margin-top:6px">点击右下角 + 创建第一个计划</div></div>';
        return;
    }
    list.innerHTML = DATA.plans.map(function(p) {
        var pct = p.target > 0 ? Math.min(100, (p.current / p.target * 100)) : 0;
        var isDone = p.status === 'done';
        var statusText = isDone ? '已完成' : '进行中';
        var deadlineText = p.deadline ? '目标日期：' + p.deadline : '无截止日期';
        var noteHtml = p.note ? '<div style="font-size:12px;color:var(--text-hint);margin-top:6px">' + p.note + '</div>' : '';
        return '<div class="plan-card" onclick="openPlanDetail(\'' + p.id + '\')">' +
            '<div class="plan-card-header"><div class="plan-card-title">' + p.name + '</div>' +
            '<div class="plan-card-status ' + p.status + '">' + statusText + '</div></div>' +
            '<div class="plan-card-amounts"><span class="current">' + formatMoney(p.current) + '</span><span class="target">/ ' + formatMoney(p.target) + '</span></div>' +
            '<div class="progress-bar"><div class="progress-fill ' + p.status + '" style="width:' + pct + '%"></div></div>' +
            '<div class="plan-card-footer"><span>' + pct.toFixed(0) + '%</span><span>' + deadlineText + '</span></div>' +
            noteHtml +
            (isDone ? '' : '<div class="plan-card-quick"><button class="quick-deposit" onclick="event.stopPropagation();quickDeposit(\'' + p.id + '\')">快速存入</button><button class="quick-done" onclick="event.stopPropagation();markDone(\'' + p.id + '\')">标记完成</button></div>') +
            '</div>';
    }).join('');
}

function exportData() {
    var dataStr = JSON.stringify(DATA, null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sulong_account_' + new Date().toISOString().split('T')[0] + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('数据已导出');
}

function importData(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var imported = JSON.parse(e.target.result);
            if (!imported.records || !Array.isArray(imported.records)) throw new Error('格式错误');
            showConfirm('导入数据', '将覆盖当前所有数据，确定继续？', function() {
                DATA = {
                    records: imported.records || [],
                    plans: imported.plans || [],
                    customCategories: imported.customCategories || [],
                    customTags: imported.customTags || []
                };
                saveData();
                renderHome();
                if (STATE.currentPage === 'plans') renderPlans();
                toast('数据导入成功');
            });
        } catch(err) {
            toast('文件格式错误');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function showClearConfirm() {
    showConfirm('清空数据', '将永久删除所有记账记录和存钱计划，此操作不可撤销！', function() {

name = "account-book-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace 绑定
# 部署前需要先创建 KV Namespace：
# wrangler kv:namespace create ACCOUNT_BOOK_KV
[[kv_namespaces]]
binding = "ACCOUNT_BOOK_KV"
id = "你的KV_NAMESPACE_ID"

# 环境变量（部署后用 wrangler secret 设置）：
# wrangler secret put RESEND_API_KEY
# wrangler secret put JWT_SECRET
